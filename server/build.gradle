plugins {
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
    id 'java'
}

group = 'com.redis'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = '17'
}

springBoot {
    mainClass = 'com.redis.rediscachingjava.RedisCachingJavaApplication'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()
}

// The Spring Boot Gradle plugin's plain `jar` task produces a second,
// non-executable jar (server-<version>-plain.jar, no Main-Class manifest
// entry) alongside the real executable one from `bootJar`. Procfile does
// `java -jar build/libs/*.jar`, and shell glob-sorts the plain jar first
// ('-' sorts before '.'), so without this it silently launches the wrong,
// non-runnable jar in production.
tasks.named('jar') {
    enabled = false
}
